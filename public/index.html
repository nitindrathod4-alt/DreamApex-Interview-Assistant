<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DreamApex Interview Assistant</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><div class="brand"><span class="logo">D</span><div><b>DreamApex</b><small>Interview Assistant</small></div></div><div class="status"><span id="dot"></span><span id="statusText">Connecting...</span></div></header><main class="layout"><section class="card"><div class="section-title"><h2>Interview Setup</h2><button id="clearBtn" class="ghost">Clear</button></div><div class="grid"><label>Role<input id="role" placeholder="DevOps Engineer"></label><label>Company<input id="company" placeholder="Company name"></label></div><label>Job Description<textarea id="jd" rows="4" placeholder="Paste job description..."></textarea></label><label>Resume / Candidate Context<textarea id="resume" rows="4" placeholder="Paste verified skills, projects and experience..."></textarea></label></section><section class="card"><div class="section-title"><h2>Interview Question</h2><button id="micBtn" class="mic">🎙 Speak</button></div><textarea id="question" rows="5" placeholder="Type or speak the question..."></textarea><div class="controls"><select id="mode"><option value="concise">Concise</option><option value="detailed">Detailed</option><option value="STAR">STAR</option><option value="technical">Technical</option><option value="followup">Follow-up Questions</option></select><select id="language"><option>English</option><option>Hindi</option><option>Marathi</option></select><button id="generate" class="primary">Generate Answer ✨</button></div></section><section class="card"><div class="section-title"><h2>AI Answer</h2><div><button id="copyBtn" class="ghost">Copy</button><button id="speakBtn" class="ghost">🔊 Speak</button></div></div><div id="answer" class="answer empty">Your generated answer will appear here.</div><div id="followups" class="followups"></div></section><section class="card"><div class="section-title"><h2>Session History</h2><button id="clearHistory" class="ghost">Clear history</button></div><div id="history" class="history"></div></section></main><script src="/app.js"></script></body></html>
