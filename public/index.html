<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DreamApex Interview Assistant</title><link rel="stylesheet" href="/style.css"></head><body><main class="app"><header><div><h1>DreamApex</h1><p>Interview Assistant • Local</p></div><span id="status">Connecting…</span></header><section class="card"><label>Interview question</label><textarea id="question" rows="5" placeholder="Type or dictate the interviewer's question…"></textarea><div class="controls"><select id="mode"><option value="concise">Concise answer</option><option value="detailed">Detailed answer</option><option value="star">STAR format</option><option value="technical">Technical explanation</option></select><button id="mic">🎙 Start dictation</button><button id="ask">Generate Answer</button></div></section><section class="card"><div class="head"><h2>Suggested answer</h2><button id="copy">Copy</button></div><pre id="answer">Your answer will appear here.</pre></section><section class="card"><h2>Session history</h2><div id="history"></div></section></main><script src="/app.js"></script></body></html>
